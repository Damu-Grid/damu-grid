[project]
name = "damu-grid"
version = "0.1.0"
description = "Expiry-aware synthetic red-cell redistribution review queue"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pandas>=2.2",
    "numpy>=1.26",
    "starlette>=0.46,<1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data/raw"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
