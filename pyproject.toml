[project]
name = "damu-grid"
version = "0.1.0"
description = "Damu Grid: expiry-aware red-cell redistribution review queue (Terumo BCT Africa Hackathon 2026)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "dataset: reads the full official CSVs in data/raw (slower)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data/raw"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The pipeline was written at 110 columns before the shared 100-column setting landed, and its CSV
# fixtures mirror official headers. Only the line-length rule is relaxed; all other rules apply.
"pipeline/*" = ["E501"]
"tests/pipeline/*" = ["E501"]
"scripts/check_submission.py" = ["E501"]
