name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Ruff lint
        run: |
          if git ls-files '*.py' | grep -v '^data/raw/' | grep -q .; then
            uvx ruff check . --extend-exclude data/raw
          else
            echo "No Python code yet, skipping."
          fi
      - name: Pytest
        run: |
          if [ -f pyproject.toml ] && git ls-files 'tests/*.py' 'tests/**/*.py' | grep -q .; then
            uv sync --all-extras --dev || uv sync
            uv run pytest -q
          else
            echo "No pyproject.toml or Python tests yet, skipping."
          fi

  frontend:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check for frontend app
        id: detect
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No frontend/package.json yet, skipping."; fi
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.present == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install, lint, typecheck, test, build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm run --if-present lint
          pnpm run --if-present typecheck
          pnpm run --if-present test
          pnpm run build

  safety:
    name: Secrets and dataset guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block committed env files
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Env files must not be committed:"; echo "$bad"; exit 1; fi
      - name: Gitleaks secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --no-banner
      - name: Starter dataset unchanged
        run: cd data/raw && sha256sum -c --quiet SHA256SUMS
      - name: No large files outside data/raw
        run: |
          big=$(git ls-files -z | xargs -0 -I{} sh -c 'case "{}" in data/raw/*) ;; *) [ -f "{}" ] && [ $(stat -c%s "{}") -gt 5242880 ] && echo "{}";; esac' || true)
          if [ -n "$big" ]; then echo "Files over 5 MB outside data/raw:"; echo "$big"; exit 1; fi
